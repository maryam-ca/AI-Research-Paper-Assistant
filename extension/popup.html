<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; }
      h3 { margin: 0 0 8px; font-size: 14px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; }
      button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
      button:disabled { opacity: .6; }
      .status { margin-top: 8px; font-size: 12px; min-height: 16px; }
      .api { font-size: 11px; color: #666; margin-bottom: 8px; }
      a { color: #4f46e5; font-size: 11px; }
    </style>
  </head>
  <body>
    <h3>ScholarFlow Quick Add</h3>
    <div class="api">API: <input id="api" placeholder="http://localhost:8000/api" /></div>
    <input id="url" placeholder="Paste a paper / PDF link…" />
    <button id="add">Add to Library</button>
    <div class="status" id="status"></div>
    <p><a id="current" href="#">Use current tab URL</a></p>
    <script src="popup.js"></script>
  </body>
</html>
